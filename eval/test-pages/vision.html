<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aegis vision test — loan application</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #eef1f6; color: #1c2430; }
    .app { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }
    .card { background: #fff; border-radius: 12px; padding: 28px 32px; box-shadow: 0 4px 18px rgba(20,30,60,.08); }
    h1 { font-size: 24px; margin-bottom: 6px; }
    .sub { color: #5a6b83; margin-bottom: 24px; font-size: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: #42506b; margin-bottom: 6px; }
    .field input { width: 100%; padding: 10px 12px; border: 1px solid #cfd8e6; border-radius: 8px; font-size: 14px; }
    .photo { position: absolute; left: 450px; top: 50px; width: 300px; height: 300px;
             box-shadow: 0 4px 14px rgba(0,0,0,.18); border-radius: 12px; }
    .bio { margin-top: 18px; padding: 12px 14px; background: #f6f8fc; border-radius: 8px; font-size: 14px; color: #2a3648; }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <h1>Personal Loan Application</h1>
      <div class="sub">State Bank Demo Branch — form 2048</div>
      <div class="grid">
        <div class="field"><label>Full Name</label><input id="fullname" placeholder="Full Name"></div>
        <div class="field"><label>Email Address</label><input id="email" type="email" autocomplete="email"></div>
        <div class="field"><label>Mobile Number</label><input id="phone" autocomplete="tel"></div>
        <div class="field"><label>Date of Birth</label><input id="dob" placeholder="DD/MM/YYYY"></div>
        <div class="field"><label>Password (net banking)</label><input id="pass" type="password" placeholder="••••••••"></div>
        <div class="field"><label>City</label><input id="city" placeholder="City"></div>
      </div>
      <div class="bio">Applicant: <span class="pii-per">Ananya Rao</span> • <span class="pii-loc">Bengaluru</span>,
        Karnataka • referred by <span class="pii-org">ISRO</span> recruitment drive • mobile 9876543210</div>
      <img src="/face.png" class="photo" alt="applicant photo">
    </div>
  </div>
</body>
</html>
